# Every run step is Python; the same tools/test.py entrypoint runs locally.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: python {0}
jobs:
  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    env:
      STOPWORDS_LIST: ${{ secrets.RETROLARIUM_STOPWORDS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, "tools/test.py", "--suite", "python"], check=True)
      - name: Stop words in the tree and history
        if: env.STOPWORDS_LIST != '' && matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, "tools/test.py", "--suite", "checks", "--history"], check=True)
  native:
    name: Native C++ and Python bridge (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and test
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, "tools/test.py", "--suite", "native"], check=True)
  sanitize:
    name: ASan and UBSan (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and test with sanitizers
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, "tools/test.py", "--suite", "native", "--sanitize", "--config", "RelWithDebInfo"], check=True)
